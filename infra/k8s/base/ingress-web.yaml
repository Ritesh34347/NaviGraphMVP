apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.navigraph.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-stable
                port:
                  number: 3000
