apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: navigraph
  labels:
    app: redis
spec:
  # A single replica, matching infra/docker-compose.yml -- redis here is a
  # query-result/session cache, not a durable store (no PVC, matching the
  # existing compose file, which has no redis-data volume either).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
