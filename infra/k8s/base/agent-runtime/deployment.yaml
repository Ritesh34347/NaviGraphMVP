apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: navigraph
  labels:
    app: agent-runtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: navigraph-agent-runtime:unset
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: navigraph-app-env
            - secretRef:
                name: agent-runtime-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
