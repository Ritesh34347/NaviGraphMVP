apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: navigraph
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
    - name: prometheus-exporter
      port: 8889
      targetPort: 8889
    - name: health
      port: 13133
      targetPort: 13133
