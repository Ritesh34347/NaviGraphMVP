apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: api.navigraph.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-stable
                port:
                  number: 8000
