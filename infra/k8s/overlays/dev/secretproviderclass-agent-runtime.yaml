# REAL AZURE VALUES, substituted after Phase 10b's terraform apply -- the
# `userAssignedIdentityID`/`keyvaultName`/`tenantId` fields below are the
# real values (previously REPLACE_AFTER_APPLY placeholders), not templates.
# Real Key Vault secrets this expects to already exist (created once,
# out-of-band, by whoever administers the vault -- not by Terraform, which
# never stores secret VALUES, only the vault itself): ANTHROPIC-API-KEY,
# SNOWFLAKE-PASSWORD, POSTGRES-PASSWORD (the real
# module.postgres_flexible_server administrator_password), NEO4J-PASSWORD.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-runtime-kv
  namespace: navigraph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # terraform output aks_key_vault_secrets_provider_client_id
    userAssignedIdentityID: 002030c6-3c35-451f-86c0-4041554413f2
    keyvaultName: navigraph-dev-kv
    tenantId: 1e5c968b-dcc2-4d5d-b47b-242cf018cda4
    objects: |
      array:
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
        - |
          objectName: SNOWFLAKE-PASSWORD
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: NEO4J-PASSWORD
          objectType: secret
  secretObjects:
    - secretName: agent-runtime-secrets
      type: Opaque
      data:
        - objectName: ANTHROPIC-API-KEY
          key: ANTHROPIC_API_KEY
        - objectName: SNOWFLAKE-PASSWORD
          key: SNOWFLAKE_PASSWORD
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: NEO4J-PASSWORD
          key: NEO4J_PASSWORD
