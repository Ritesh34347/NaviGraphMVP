# REQUIRES REAL AZURE VALUES FILLED IN AFTER PHASE 10B'S terraform apply --
# see the four REPLACE_AFTER_APPLY placeholders below. Real Key Vault
# secrets this expects to already exist (created once, out-of-band, by
# whoever administers the vault -- not by Terraform, which never stores
# secret VALUES, only the vault itself): ANTHROPIC-API-KEY,
# SNOWFLAKE-PASSWORD, POSTGRES-PASSWORD (the real
# module.postgres_flexible_server administrator_password), NEO4J-PASSWORD.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-runtime-kv
  namespace: navigraph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # terraform output aks_key_vault_secrets_provider_client_id
    userAssignedIdentityID: REPLACE_AFTER_APPLY_CLIENT_ID
    # terraform output key_vault_uri's hostname segment, e.g.
    # "navigraph-dev-kv" from "https://navigraph-dev-kv.vault.azure.net/"
    keyvaultName: REPLACE_AFTER_APPLY_VAULT_NAME
    tenantId: REPLACE_AFTER_APPLY_TENANT_ID
    objects: |
      array:
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
        - |
          objectName: SNOWFLAKE-PASSWORD
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: NEO4J-PASSWORD
          objectType: secret
  secretObjects:
    - secretName: agent-runtime-secrets
      type: Opaque
      data:
        - objectName: ANTHROPIC-API-KEY
          key: ANTHROPIC_API_KEY
        - objectName: SNOWFLAKE-PASSWORD
          key: SNOWFLAKE_PASSWORD
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: NEO4J-PASSWORD
          key: NEO4J_PASSWORD
