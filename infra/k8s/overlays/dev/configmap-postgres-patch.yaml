# Real value from Terraform's `postgres_fqdn` output (terraform output -raw
# postgres_fqdn in terraform/environments/dev) after Phase 10b's real apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: navigraph-app-env
  namespace: navigraph
data:
  POSTGRES_HOST: navigraph-dev-pg-cus.postgres.database.azure.com
  POSTGRES_USER: navigraphadmin
  POSTGRES_DB: navigraph
