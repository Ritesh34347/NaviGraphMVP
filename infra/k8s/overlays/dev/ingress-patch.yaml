# Real hostnames as of Phase 10b's cluster bootstrap: no registered domain
# exists yet, so this uses nip.io (a free wildcard DNS service that
# resolves any "<label>.<ip-with-dashes>.nip.io" hostname to that IP, no
# registration needed), pointed at the real ingress-nginx LoadBalancer's
# external IP (51.8.46.125, confirmed via `kubectl -n ingress-nginx get svc
# ingress-nginx-controller`). cert-manager's letsencrypt-prod ClusterIssuer
# (see cluster-issuer.yaml) can now issue real certs against this stable
# hostname via the HTTP01 challenge.
#
# REAL BUG, found live: `spec.rules` has no Kubernetes-defined patch merge
# key, so a strategic-merge patch supplying only `host` REPLACES THE WHOLE
# rules ARRAY -- silently deleting each base Ingress's `http.paths.backend`
# entirely (the exact same list-replacement gotcha already hit once in this
# project for StatefulSet volumeClaimTemplates, see LIMITATIONS.md). This
# went undetected because Phase 10a's kind validation never exercised this
# dev-only patch. The symptom was severe: nginx's admission webhook panics
# (nil pointer in mergeAlternativeBackends) trying to validate an Ingress
# with zero backends, taking down every `kubectl apply` touching Ingress
# objects. Fixed by repeating the FULL rules block (path + backend) here,
# not just the changed field.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - app.navigraph.51-8-46-125.nip.io
      secretName: web-tls
  rules:
    - host: app.navigraph.51-8-46-125.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-stable
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-canary
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.navigraph.51-8-46-125.nip.io
      secretName: web-tls
  rules:
    - host: app.navigraph.51-8-46-125.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-canary
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - api.navigraph.51-8-46-125.nip.io
      secretName: gateway-tls
  rules:
    - host: api.navigraph.51-8-46-125.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-stable
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-canary
  namespace: navigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.navigraph.51-8-46-125.nip.io
      secretName: gateway-tls
  rules:
    - host: api.navigraph.51-8-46-125.nip.io
      http:
        paths:
          - path: /
