# See secretproviderclass-agent-runtime.yaml's header comment: the real
# Azure values below (already substituted after Phase 10b's terraform
# apply) are shared by every SecretProviderClass in this overlay.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: neo4j-kv
  namespace: navigraph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: 002030c6-3c35-451f-86c0-4041554413f2
    keyvaultName: navigraph-dev-kv
    tenantId: 1e5c968b-dcc2-4d5d-b47b-242cf018cda4
    objects: |
      array:
        - |
          objectName: NEO4J-PASSWORD
          objectType: secret
  secretObjects:
    - secretName: neo4j-secrets
      type: Opaque
      data:
        - objectName: NEO4J-PASSWORD
          key: NEO4J_PASSWORD
