# Two ACME ClusterIssuers: letsencrypt-staging (untrusted certs, no
# meaningful rate limit -- use this first to validate the HTTP01 challenge
# actually works before ever touching the production issuer) and
# letsencrypt-prod (real, browser-trusted certs, genuinely rate-limited to
# 5 certs/registered-domain/week). ingress-patch.yaml's
# cert-manager.io/cluster-issuer annotation should point at
# letsencrypt-staging until a real certificate has been observed to issue
# successfully, then be switched to letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ritesh.singh@navikenz.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ritesh.singh@navikenz.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
