# See secretproviderclass-agent-runtime.yaml's header comment for the
# REPLACE_AFTER_APPLY placeholders shared by every SecretProviderClass in
# this overlay.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-kv
  namespace: navigraph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: REPLACE_AFTER_APPLY_CLIENT_ID
    keyvaultName: REPLACE_AFTER_APPLY_VAULT_NAME
    tenantId: REPLACE_AFTER_APPLY_TENANT_ID
    objects: |
      array:
        - |
          objectName: GRAFANA-ADMIN-PASSWORD
          objectType: secret
  secretObjects:
    - secretName: grafana-secrets
      type: Opaque
      data:
        - objectName: GRAFANA-ADMIN-PASSWORD
          key: GRAFANA_ADMIN_PASSWORD
