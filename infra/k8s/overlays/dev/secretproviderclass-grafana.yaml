# See secretproviderclass-agent-runtime.yaml's header comment for the
# REPLACE_AFTER_APPLY placeholders shared by every SecretProviderClass in
# this overlay.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-kv
  namespace: navigraph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: 002030c6-3c35-451f-86c0-4041554413f2
    keyvaultName: navigraph-dev-kv
    tenantId: 1e5c968b-dcc2-4d5d-b47b-242cf018cda4
    objects: |
      array:
        - |
          objectName: GRAFANA-ADMIN-PASSWORD
          objectType: secret
  secretObjects:
    - secretName: grafana-secrets
      type: Opaque
      data:
        - objectName: GRAFANA-ADMIN-PASSWORD
          key: GRAFANA_ADMIN_PASSWORD
