apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See base/kustomization.yaml's comment on this same field -- base's
# namespace transformer does NOT retroactively apply to THIS overlay's own
# configMapGenerator entries (postgres-init below), only to resources
# already stamped by base's own build. Needed here for the same real
# reason (postgres-init landed in the wrong namespace during Phase 10a's
# own kind validation before this was added).
namespace: navigraph

resources:
  - ../../base
  - postgres/deployment.yaml
  - postgres/service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-init
    files:
      - ../../../postgres/init/001_extensions.sql

patches:
  - path: configmap-postgres-patch.yaml
  - path: patch-storageclass.yaml

# Loaded directly into containerd via `kind load docker-image`, never
# pushed to any registry -- see docs/runbooks/k8s-local-validation.md.
images:
  - name: navigraph-gateway
    newTag: local
  - name: navigraph-agent-runtime
    newTag: local
  - name: navigraph-web
    newTag: local
