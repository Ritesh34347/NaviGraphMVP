# Local-first NaviGraph stack. This is the everyday inner dev loop; Azure
# (see ../terraform) is the eventual cloud target and is never provisioned
# from this file. Copy .env.example to .env before running:
#
#   docker compose -f infra/docker-compose.yml up -d
#
# See docs/runbooks/local-dev-smoke-test.md for the full walkthrough.

networks:
  navigraph-net:
    name: navigraph-net
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  grafana-data:

services:
  # ---------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: navigraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - navigraph-net

  neo4j:
    image: neo4j:5-community
    container_name: navigraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j/conf/neo4j.conf.local:/conf/neo4j.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - navigraph-net

  redis:
    image: redis:7
    container_name: navigraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - navigraph-net

  # ---------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: navigraph-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133" # health_check extension, published so it can be checked from the host
    # No Docker-level healthcheck: otel/opentelemetry-collector-contrib is a
    # scratch image with no /bin/sh, wget, or curl (confirmed via `docker
    # exec navigraph-otel-collector wget` -> "executable file not found"),
    # so an exec-based healthcheck can't run inside this container. The
    # health_check extension (port 13133, enabled in
    # infra/otel/otel-collector-config.yaml) is checked from the host by
    # tools/scripts/smoke-test.sh instead. Every agent codes its OTel
    # exporter to degrade gracefully if this collector is unreachable (spans
    # are dropped, never crash the app -- see
    # packages/shared/navigraph_shared/telemetry/tracing.py), so downstream
    # services only need this container *started*, not proven healthy.
    networks:
      - navigraph-net

  prometheus:
    image: prom/prometheus:latest
    container_name: navigraph-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - navigraph-net

  grafana:
    image: grafana/grafana:latest
    container_name: navigraph-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - navigraph-net

  # ---------------------------------------------------------------------
  # Policy
  # ---------------------------------------------------------------------

  opa:
    image: openpolicyagent/opa:latest
    container_name: navigraph-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--config-file=/conf/config.yaml"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/conf/config.yaml:/conf/config.yaml:ro
    ports:
      - "8181:8181"
    # No Docker-level healthcheck: the official openpolicyagent/opa image is
    # a minimal static binary with no /bin/sh, wget, or curl (confirmed via
    # `docker exec navigraph-opa wget` -> "executable file not found"), so an
    # exec-based HTTP healthcheck can't run inside this container at all.
    # Nothing else in this stack depends on OPA's health condition (see
    # LIMITATIONS.md item 4 -- it's an allow-all placeholder anyway); real
    # liveness is checked from the host by tools/scripts/smoke-test.sh,
    # which does have curl/wget.
    networks:
      - navigraph-net

  # ---------------------------------------------------------------------
  # Query federation
  # ---------------------------------------------------------------------

  trino-coordinator:
    image: trinodb/trino:latest
    container_name: navigraph-trino-coordinator
    restart: unless-stopped
    # `catalog/` lives as a real subdirectory of ./trino/coordinator itself
    # (currently empty -- zero real catalogs registered, see LIMITATIONS.md
    # item 3) rather than as a second, separately-mounted bind mount nested
    # inside this one: nesting a second :ro mount inside an already-:ro
    # parent mount fails at container start ("read-only file system" trying
    # to create the inner mountpoint). One mount, one directory tree.
    volumes:
      - ./trino/coordinator:/etc/trino:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - navigraph-net

  trino-worker:
    image: trinodb/trino:latest
    container_name: navigraph-trino-worker
    restart: unless-stopped
    # See the coordinator's comment above -- catalog/ is a real subdirectory
    # of ./trino/worker, not a second nested bind mount.
    volumes:
      - ./trino/worker:/etc/trino:ro
    # No external port mapping — the worker is only reachable from the
    # coordinator/other workers on navigraph-net.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      trino-coordinator:
        condition: service_healthy
    networks:
      - navigraph-net

  # ---------------------------------------------------------------------
  # Application services (built by a parallel workstream; referenced here
  # by build context/Dockerfile path so this compose file is ready the
  # moment those Dockerfiles exist)
  # ---------------------------------------------------------------------

  agent-runtime:
    build:
      # Build context is the shared `packages/` directory, not
      # `packages/agent_runtime/`, because packages/agent_runtime/Dockerfile
      # also COPYs the sibling `shared` package into the image.
      context: ../packages
      dockerfile: agent_runtime/Dockerfile
    container_name: navigraph-agent-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8001"
    healthcheck:
      # python:slim has no wget/curl; the interpreter itself is guaranteed
      # present, so use it directly rather than adding a package just for this.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      otel-collector:
        # service_started, not service_healthy: otel-collector has no
        # Docker-level healthcheck (see its service definition above), and
        # this app's OTel exporter degrades gracefully if the collector
        # isn't reachable yet anyway.
        condition: service_started
    networks:
      - navigraph-net

  gateway:
    build:
      # Build context is the shared `packages/` directory, not
      # `packages/gateway/`, because packages/gateway/Dockerfile also COPYs
      # the sibling `shared` package into the image.
      context: ../packages
      dockerfile: gateway/Dockerfile
    container_name: navigraph-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_RUNTIME_URL: http://agent-runtime:8001
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    healthcheck:
      # python:slim has no wget/curl; the interpreter itself is guaranteed
      # present, so use it directly rather than adding a package just for this.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      agent-runtime:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - navigraph-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: navigraph-web
    restart: unless-stopped
    environment:
      # GATEWAY_URL is read server-side (page.tsx's server component runs
      # inside this container, so it must use Docker's internal service
      # DNS name -- "localhost" here would mean the web container itself).
      # NEXT_PUBLIC_GATEWAY_URL is for browser-side code, which runs on the
      # host machine where gateway's port is actually published to
      # localhost, so it correctly differs from GATEWAY_URL.
      GATEWAY_URL: http://gateway:8000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: this container's /etc/hosts resolves
      # localhost to ::1 first, but the Next.js standalone server only
      # binds IPv4 0.0.0.0, so `wget http://localhost:3000` gets refused
      # over IPv6 even though the app is up and serving fine over IPv4
      # (confirmed manually: `wget http://127.0.0.1:3000/` returns the
      # real rendered page).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - navigraph-net
