global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Kubernetes counterpart to prometheus.yml (compose, static_configs against
# docker-compose service DNS names). This file exists specifically because
# Phase 10's canary rollout gate (tools/scripts/canary_gate.py) needs the
# ingress-nginx controller's own per-backend metrics
# (nginx_ingress_controller_requests/_request_duration_seconds_bucket,
# labeled by `service`), which only exist once the app is actually running
# behind an Ingress -- prometheus.yml's compose-oriented static_configs have
# no equivalent for this. Static targets, not kubernetes_sd_configs pod
# discovery: this Kustomize tree's every Service already has a stable,
# well-known DNS name (see infra/k8s/base/*/service*.yaml), so dynamic pod
# discovery would add real complexity (RBAC for the Prometheus pod to list
# pods/endpoints) for no benefit over just listing the known Service names
# directly, matching this file's sibling's own static_configs style.
scrape_configs:
  - job_name: "gateway-stable"
    static_configs:
      - targets: ["gateway-stable.navigraph.svc.cluster.local:8000"]
    metrics_path: /metrics

  - job_name: "gateway-canary"
    static_configs:
      - targets: ["gateway-canary.navigraph.svc.cluster.local:8000"]
    metrics_path: /metrics

  - job_name: "agent-runtime"
    static_configs:
      - targets: ["agent-runtime.navigraph.svc.cluster.local:8001"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector.navigraph.svc.cluster.local:8889"]

  # The ingress-nginx controller's own metrics -- the real source of truth
  # for tools/scripts/canary_gate.py's promotion-gate checks (per-backend
  # request/error/latency metrics, labeled by `service`, covering BOTH
  # gateway and web canary rollouts with zero app-code changes, since web
  # has no /metrics endpoint of its own). ingress-nginx is cluster
  # infrastructure installed once via its official static manifests (see
  # docs/runbooks/k8s-local-validation.md), not part of this Kustomize
  # tree -- its Service name/namespace/port below (ingress-nginx-controller-metrics,
  # ingress-nginx namespace, port 10254) are ingress-nginx's own documented
  # defaults when metrics are enabled. If a real install ever changes these,
  # this job will simply fail to scrape rather than silently succeed with no
  # data, matching this file's own trino-coordinator job's precedent in
  # prometheus.yml.
  - job_name: "ingress-nginx-controller"
    static_configs:
      - targets: ["ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254"]
    metrics_path: /metrics
