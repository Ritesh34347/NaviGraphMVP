global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics

  - job_name: "agent-runtime"
    static_configs:
      - targets: ["agent-runtime:8001"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # NOTE (known gap, see LIMITATIONS.md): Trino does not expose Prometheus-
  # format metrics out of the box — its native metrics surface is JMX. This
  # scrape config assumes a JMX exporter agent is attached to the Trino JVM
  # exposing an HTTP endpoint on the same port; that exporter is not
  # configured yet in infra/trino/. Until it is, this job will simply fail to
  # scrape rather than silently succeed with no data.
  - job_name: "trino-coordinator"
    static_configs:
      - targets: ["trino-coordinator:8080"]
    metrics_path: /metrics
