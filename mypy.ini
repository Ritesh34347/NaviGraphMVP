; Real, root-level mypy config -- required because mypy discovers its
; config file by walking from the CURRENT WORKING DIRECTORY only (unlike
; ruff/pytest, which walk up from each file to its nearest ancestor
; config). CI's real invocation (.github/workflows/ci.yml, "Type-check
; (mypy)" step) runs `mypy --exclude '(^|[\/])(tests|migrations)([\/]|$)'
; packages/` from the repo root -- confirmed live that with no config
; file here, mypy falls back to "Config File: Default" and silently
; never reads any individual package's own `[tool.mypy]` section in its
; pyproject.toml (e.g. packages/semantic_model/pyproject.toml already set
; ignore_missing_imports = true for its stub-less `yaml` import, but that
; setting was dead: never actually read by the real CI command). This
; file is what CI's real invocation actually uses.
;
; REAL BUG, found live on this PR's first real GitHub Actions run:
; python_version = 3.11 here mismatched ci.yml's actual
; `Set up Python 3.12` step. mypy applies `python_version` to every file
; it parses, INCLUDING third-party bundled stub files -- CI's installed
; numpy ships a stub (`numpy/__init__.pyi`) using a PEP 695 `type`
; statement, valid only in Python 3.12+. Targeting 3.11 made mypy reject
; that stub outright ("Type statement is only supported in Python 3.12
; and greater"), failing the whole run before it ever reached this repo's
; own code. Every per-package `pyproject.toml`'s own `[tool.mypy]` section
; independently claims `python_version = "3.11"` too (dead config, per
; the note above) -- so this mismatch was invisible until this file
; became the first config CI's mypy invocation actually read. Bumped to
; 3.12 to match ci.yml's real interpreter version, not the un-verified
; value every dead per-package config happened to repeat.
[mypy]
python_version = 3.12
ignore_missing_imports = True
