[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navigraph-shared"
version = "0.1.0"
description = "NaviGraph shared foundation: contracts, telemetry, config, and LLM client abstractions used by every service and agent."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "prometheus-client",
    "anthropic",
    "httpx",
    # Lazily imported inside AzureKeyVaultSecretsProvider.get() only --
    # mirrors snowflake-connector-python/psycopg2-binary's established
    # pattern of a real, declared dependency that importing this package
    # doesn't require to actually be usable at import time.
    "azure-identity",
    "azure-keyvault-secrets",
    # Lazily imported inside AzureAdTokenVerifier only, same convention.
    # The `crypto` extra pulls in `cryptography`, required for RS256
    # signature verification (Azure AD tokens are never HS256/none).
    "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["navigraph_shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
