[alembic]
script_location = migrations

# No file template override -- files are named by the hand-authored
# revision IDs used in this package (0001_initial_schema.py, etc.), not a
# generated timestamp/slug.

# sqlalchemy.url is intentionally left blank here: migrations/env.py builds
# the real URL at runtime from `navigraph_catalog.settings.MetadataCatalogSettings`
# (which reads POSTGRES_HOST/POSTGRES_PORT/POSTGRES_USER/POSTGRES_PASSWORD/
# POSTGRES_DB from the environment or a .env file), so `alembic upgrade
# head` just works from any shell with the right env vars set -- no
# environment-specific URL to hardcode or edit here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
