[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navigraph-gateway"
version = "0.1.0"
description = "NaviGraph public-facing gateway: FastAPI app that accepts user questions and routes them to the agent-runtime."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    # Local workspace dependency. This is a bare, unpinned PEP 508 name --
    # it is intentionally NOT a file:// path reference (those require
    # absolute paths and behave inconsistently across pip versions for
    # local monorepos). Instead, install order matters: run
    #   pip install -e packages/shared
    # BEFORE
    #   pip install -e packages/gateway
    # so that `navigraph-shared` is already satisfied in the environment
    # when pip resolves this package's dependencies. See packages/pyproject.toml.
    "navigraph-shared",
    # Phase 4 of the configurable-platform build plan: the gateway was
    # previously a deliberately stateless HTTP proxy with zero Postgres
    # dependency -- this is a new, real one, so `TenantVerifierResolver`
    # (`navigraph_gateway.identity`) can look up a tenant's
    # `TenantIdentityConfig` row live. Install order matters the same way
    # as `navigraph-shared` above: `pip install -e packages/connector_sdk`
    # then `packages/metadata_catalog` BEFORE `packages/gateway` (matches
    # `ci.yml`'s real, already-correct order).
    "navigraph-connector-sdk",
    "navigraph-metadata-catalog",
    "prometheus-fastapi-instrumentator",
    # Not in the original spec's minimal dep list, but required for the
    # "OTel FastAPI auto-instrumentation" requirement on this service.
    "opentelemetry-instrumentation-fastapi",
    # MCP (Model Context Protocol) server, mounted at `/mcp` -- see
    # `mcp_tools.py`. Pinned to the 1.x line deliberately: the official
    # `mcp` package shipped a breaking 2.0.0 (2026-07-28) that renames
    # `FastMCP` -> `MCPServer`, moves `mcp.server.fastmcp` ->
    # `mcp.server.mcpserver`, raises the `pydantic`/`anyio` floors, and
    # drops `httpx` for a new `httpx2` package -- an unpinned install
    # would silently break every import in this module on the next
    # `pip install`.
    "mcp>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["navigraph_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a route's default args is FastAPI's own real DI
# mechanism, not a mutable-default bug -- this is ruff's own documented
# allowance for FastAPI (https://docs.astral.sh/ruff/rules/function-call-in-default-argument/).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
