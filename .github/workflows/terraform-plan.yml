# IMPORTANT: this workflow must never run `terraform apply`. Its only job is to
# prove the skeleton is syntactically valid (`fmt`, `validate`) and, when Azure
# credentials happen to be configured as repo secrets, to produce a read-only
# `plan` for review. Applying infrastructure changes is a manual, human-approved
# action performed outside of CI — see terraform/README.md.
name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-and-validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check (whole tree)
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate — environments
        run: |
          set -e
          for dir in terraform/environments/*/; do
            echo "== Validating $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Terraform validate — modules
        run: |
          set -e
          for dir in terraform/modules/*/; do
            echo "== Validating $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  # REAL BUG, found live via `gh run list`/`gh run view`: this whole workflow
  # was being rejected outright by GitHub as an "invalid workflow file" on
  # every single push/PR (0 jobs ever scheduled) -- the `secrets` context is
  # not allowed in a job-level `if:` (only `github`/`needs`/`vars`/`inputs`
  # are: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs).
  # `secrets` is only readable inside a step (env/run/with), so the
  # credential check is moved into its own job's step here, and `plan`
  # instead checks that job's `needs.*.outputs` (which IS allowed at the job
  # level).
  check-azure-creds:
    name: Check whether Azure credentials are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for AZURE_CLIENT_ID secret
        id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: terraform plan (dev) — only if Azure credentials are configured
    needs: [fmt-and-validate, check-azure-creds]
    runs-on: ubuntu-latest
    if: needs.check-azure-creds.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (dev)
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform plan (dev) — read-only, never applied in CI
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock=false
