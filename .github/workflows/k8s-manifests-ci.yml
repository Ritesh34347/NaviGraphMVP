# Real, zero-Azure-cost proof that infra/k8s/'s manifests actually work --
# runs entirely on the GitHub-hosted runner via a real `kind` cluster.
# Continuously re-proves manifest correctness AND the canary weighting
# mechanism itself (the highest-risk new piece of the whole Phase 10
# design) on every PR touching infra/k8s/**, before Azure is ever touched.
name: K8s Manifests CI

on:
  pull_request:
    paths:
      - "infra/k8s/**"
      - "infra/opa/**"
      - "infra/neo4j/**"
      - "infra/prometheus/**"
      - "infra/grafana/**"
      - "infra/postgres/**"
      - "packages/gateway/**"
      - "packages/agent_runtime/**"
      - "web/**"

env:
  KUSTOMIZE_VERSION: "5.8.1"
  KIND_VERSION: "v0.27.0"

jobs:
  validate-manifests:
    name: build + apply + canary-weight proof (real kind cluster)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install standalone kustomize
        run: |
          curl -sL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${{ env.KUSTOMIZE_VERSION }}/kustomize_v${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Build both overlays (catches Kustomize errors with zero cluster needed)
        run: |
          kustomize build infra/k8s/overlays/kind --load-restrictor LoadRestrictionsNone > /tmp/kind-build.yaml
          kustomize build infra/k8s/overlays/dev --load-restrictor LoadRestrictionsNone > /tmp/dev-build.yaml
          echo "kind overlay: $(grep -c '^kind: ' /tmp/kind-build.yaml) resources"
          echo "dev overlay: $(grep -c '^kind: ' /tmp/dev-build.yaml) resources"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          config: infra/k8s/kind-config.yaml
          cluster_name: navigraph-dev

      - name: Install ingress-nginx (kind provider)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f infra/k8s/ingress-nginx-metrics-service.yaml
          kubectl -n ingress-nginx wait --for=condition=Available deployment/ingress-nginx-controller --timeout=180s

      - name: Build the 3 app images and load into kind (no registry, no ACR)
        run: |
          docker build -f packages/gateway/Dockerfile -t navigraph-gateway:local packages/
          docker build -f packages/agent_runtime/Dockerfile -t navigraph-agent-runtime:local packages/
          docker build -f web/Dockerfile -t navigraph-web:local web/
          kind load docker-image navigraph-gateway:local navigraph-agent-runtime:local navigraph-web:local --name navigraph-dev

      - name: Create the manual secret (kind overlay has no CSI driver -- see overlays/kind/secret-instructions.md)
        run: |
          kubectl create namespace navigraph --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic agent-runtime-secrets -n navigraph \
            --from-literal=ANTHROPIC_API_KEY=ci-placeholder-fakellmclient-not-used \
            --from-literal=SNOWFLAKE_PASSWORD=ci-placeholder-not-used \
            --from-literal=POSTGRES_PASSWORD=navigraph-kind-local \
            --from-literal=NEO4J_PASSWORD=navigraph-kind-local
          kubectl create secret generic neo4j-secrets -n navigraph \
            --from-literal=NEO4J_PASSWORD=navigraph-kind-local
          kubectl create secret generic grafana-secrets -n navigraph \
            --from-literal=GRAFANA_ADMIN_PASSWORD=navigraph-kind-local

      - name: Apply the kind overlay
        run: kustomize build infra/k8s/overlays/kind --load-restrictor LoadRestrictionsNone | kubectl apply -f -

      - name: Wait for every workload to become Ready
        run: |
          kubectl -n navigraph wait --for=condition=Available deployment --all --timeout=300s
          kubectl -n navigraph rollout status statefulset/neo4j --timeout=300s

      - name: Real HTTP smoke test through the real ingress
        run: |
          set -e
          curl -sf --resolve api.navigraph.example.com:80:127.0.0.1 http://api.navigraph.example.com/healthz
          curl -sf --resolve app.navigraph.example.com:80:127.0.0.1 http://app.navigraph.example.com/ -o /dev/null

      - name: Real canary-weighting proof -- build a v2 gateway image with a distinguishable marker
        run: |
          set -e
          cat >> packages/gateway/navigraph_gateway/main.py <<'EOF'


          @app.get("/healthz-canary-marker")
          async def healthz_canary_marker() -> dict:
              return {"status": "ok", "marker": "canary-v2"}
          EOF
          docker build -f packages/gateway/Dockerfile -t navigraph-gateway:local-v2 packages/
          kind load docker-image navigraph-gateway:local-v2 --name navigraph-dev
          kubectl set image deployment/gateway-canary gateway=navigraph-gateway:local-v2 -n navigraph
          kubectl rollout status deployment/gateway-canary -n navigraph --timeout=120s

      - name: Shift 10% canary weight and fire real requests, checking the observed split
        run: |
          set -e
          kubectl patch ingress gateway-canary -n navigraph --type=merge \
            -p '{"metadata":{"annotations":{"nginx.ingress.kubernetes.io/canary-weight":"10"}}}'
          sleep 5
          MARKER_COUNT=0
          TOTAL=200
          for i in $(seq 1 $TOTAL); do
            if curl -sf --resolve api.navigraph.example.com:80:127.0.0.1 \
                 http://api.navigraph.example.com/healthz-canary-marker 2>/dev/null | grep -q canary-v2; then
              MARKER_COUNT=$((MARKER_COUNT + 1))
            fi
          done
          echo "canary-v2 marker seen in $MARKER_COUNT / $TOTAL requests (~$((MARKER_COUNT * 100 / TOTAL))%, expected ~10%)"
          # Real, not exact -- NGINX's canary-weight is probabilistic per-request,
          # not a hard round-robin guarantee. A generous [2, 30] band proves the
          # weighting mechanism is genuinely doing something proportional, without
          # being flaky on exact percentages over a 200-request sample.
          if [ "$MARKER_COUNT" -lt 2 ] || [ "$MARKER_COUNT" -gt 60 ]; then
            echo "FAIL: observed canary traffic share is outside the expected band for a 10% weight"
            exit 1
          fi
          echo "PASS: canary weighting is real"

      - name: Real /ask round trip against the kind-local ephemeral Postgres
        run: |
          set -e
          curl -sf --resolve api.navigraph.example.com:80:127.0.0.1 \
            -X POST http://api.navigraph.example.com/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"smoke test","tenant_id":"ci-smoke-test","user_id":"ci"}' \
            -o /dev/null -w "gateway /ask responded with HTTP %{http_code}\n"

      - name: Dump pod status on failure
        if: failure()
        run: |
          kubectl -n navigraph get pods -o wide
          kubectl -n navigraph describe pods
          kubectl -n navigraph logs -l app=agent-runtime --tail=200 || true
          kubectl -n navigraph logs -l app=gateway --tail=200 || true
