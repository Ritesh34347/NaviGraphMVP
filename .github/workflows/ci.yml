name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-test:
    name: Python lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          # REAL BUG, found live on this repo's very first real GitHub Actions
          # run (this workflow had never actually executed before -- the repo
          # was only pushed to GitHub in Phase 10b): this list only ever
          # covered Phase 1's three original packages. Phases 4/5/8 added
          # agent_runtime dependencies on connector_sdk/metadata_catalog/
          # knowledge_graph/federation/lineage, none of which were ever added
          # here, so `pip install -e packages/agent_runtime` always failed to
          # resolve. Local `pytest packages/` runs never caught this because
          # they run against an already-populated dev environment, not a
          # clean pip install. Order matches packages/agent_runtime/Dockerfile's
          # real, already-correct dependency order exactly.
          pip install -e packages/shared
          pip install -e packages/connector_sdk
          pip install -e packages/metadata_catalog
          pip install -e packages/knowledge_graph
          pip install -e packages/federation
          pip install -e packages/lineage
          pip install -e packages/gateway
          pip install -e packages/agent_runtime
          pip install -e packages/semantic_model
          pip install -e packages/slack_bot
          pip install ruff mypy pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        # REAL BUG, found live on this repo's first real GitHub Actions run
        # (reproduced locally too): mypy computes each file's module name by
        # walking up to the nearest ancestor directory *without*
        # `__init__.py`. None of the packages/ subpackages (connector_sdk,
        # federation, knowledge_graph, lineage, metadata_catalog) have a
        # root `__init__.py`, so their `tests/__init__.py` files all resolve
        # to the bare module name "tests" and collide; the same thing
        # happens to `migrations/versions/0001_initial_schema.py` (both
        # `metadata_catalog` and `lineage` have one, same revision-file
        # name). This was never hit locally because no single `mypy
        # packages/` run had previously swept every colliding package
        # together. Excluding `tests/`/`migrations/` from this repo-wide
        # type-check sweep resolves it -- each package's own tests are
        # still fully exercised by the very next step (`pytest packages/`),
        # and Alembic migration scripts are plain, standalone, alembic-run
        # files that were never meant to be cross-checked against sibling
        # packages' revisions anyway.
        run: mypy --exclude '(^|[\\/])(tests|migrations)([\\/]|$)' packages/

      - name: Test (pytest)
        run: pytest packages/

  node-lint-test:
    name: Node lint, type-check, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browsers
        # REAL BUG, found live on this repo's very first real GitHub Actions
        # run: `npm run test` (playwright test) failed immediately with
        # "Executable doesn't exist" because the Playwright browser binary
        # is a separate download from `npm ci` and was never fetched here.
        # Never caught before this because the workflow had never actually
        # run against a real GitHub Actions runner until Phase 10b.
        run: npx playwright install --with-deps chromium

      - name: Test
        run: |
          if npm run | grep -q " test"; then
            npm run test
          else
            echo "No 'test' script defined in web/package.json yet — skipping."
          fi
