# Required check — cannot be skipped. If tests/security/ is empty this passes
# vacuously, which is expected until Phase 5/6 introduce real security-relevant
# components (real RBAC/ABAC OPA policies, tenant-isolation enforcement, etc.).
# A vacuous pass here is a known, accepted state — do NOT remove or make this
# check optional just because it currently has little to test.
name: Adversarial Security Tests

on:
  pull_request:

concurrency:
  group: adversarial-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-tests:
    name: Run adversarial security test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # REAL BUG, found live on this PR's first real GitHub Actions run:
        # this step only ever installed bare `pytest` -- correct back when
        # this comment block above was written and tests/security/ was
        # genuinely empty (a vacuous pass), but Phase 6 gave it real content
        # that imports navigraph_shared/navigraph_connectors/navigraph_agents
        # directly (real Guardrail agents, real OpaClient), and this step
        # was never updated. Every real run since has failed at collection
        # with ModuleNotFoundError -- confirmed via `gh run list` showing
        # identical failures across unrelated branches, so this was already
        # broken, not something this PR's own changes caused. Matches
        # ci.yml's real install list/order exactly, since tests/security/
        # exercises the same packages that suite installs.
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared
          pip install -e packages/connector_sdk
          pip install -e packages/metadata_catalog
          pip install -e packages/knowledge_graph
          pip install -e packages/federation
          pip install -e packages/lineage
          pip install -e packages/gateway
          pip install -e packages/agent_runtime
          pip install pytest
          if [ -f tests/security/requirements.txt ]; then
            pip install -r tests/security/requirements.txt
          fi

      - name: Run tests/security/
        run: pytest tests/security/ -v --tb=short
