# Required check — cannot be skipped. As of Phase 6, tests/security/ contains
# real adversarial tests (tenant isolation, OPA policy bypass attempts, PII
# exposure, fail-closed-on-insufficient-roles) plus a cloud/ suite (Phase 10a)
# for the real AKS deployment (network policy isolation, RBAC least privilege,
# secret-provider scoping, AKS API server exposure, ACR privacy, ingress TLS).
# This is no longer a vacuous pass over an empty directory — do NOT remove or
# make this check optional.
name: Adversarial Security Tests

on:
  pull_request:

concurrency:
  group: adversarial-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-tests:
    name: Run adversarial security test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f tests/security/requirements.txt ]; then
            pip install -r tests/security/requirements.txt
          fi

      - name: Run tests/security/
        run: pytest tests/security/ -v --tb=short
