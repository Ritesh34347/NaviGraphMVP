# Required check. Branch protection on `main` must require this workflow to pass
# before merge — it is part of the SOC 2 change-management control set, not an
# optional convenience check.
name: Security Scan

on:
  pull_request:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          # REAL VULNERABILITY, found live once the install-list fix below let
          # pip-audit actually run: the base toolchain's bundled setuptools
          # 65.5.0 carries 4 known CVEs (PYSEC-2022-43012, PYSEC-2025-49,
          # PYSEC-2026-1918, PYSEC-2026-3447). `pip install --upgrade pip`
          # does not touch setuptools, and nothing in this workspace declares
          # it as a dependency to pull a newer one in -- upgrade it directly.
          python -m pip install --upgrade setuptools
          # REAL BUG, found live on this PR's first real GitHub Actions run:
          # this only ever installed shared/gateway/agent_runtime, but
          # agent_runtime depends directly on navigraph-metadata-catalog,
          # navigraph-knowledge-graph, navigraph-connector-sdk,
          # navigraph-federation, and navigraph-lineage (see
          # packages/agent_runtime/pyproject.toml) -- none of which are on
          # PyPI, so pip always failed to resolve them. Confirmed pre-existing
          # via `gh run list` showing identical failures across unrelated
          # branches, not something this PR's changes caused. Order matches
          # ci.yml's real, already-correct install order exactly.
          pip install -e packages/shared
          pip install -e packages/connector_sdk
          pip install -e packages/metadata_catalog
          pip install -e packages/knowledge_graph
          pip install -e packages/federation
          pip install -e packages/lineage
          pip install -e packages/gateway
          pip install -e packages/agent_runtime
          pip install -e packages/semantic_model
          pip install -e packages/slack_bot
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  node-dependency-audit:
    name: npm audit (Node dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity and above)
        run: npm audit --audit-level=high

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
